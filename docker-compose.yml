version: '3'
services:
  wyoming-piper:
    image: rhasspy/wyoming-piper
    container_name: wyoming-piper
    command: --voice en_US-amy-medium --update-voices
    volumes:
      - ~/.cache/yakyak/piper:/data
    ports:
      - "10200:10200"
    stdin_open: true
    tty: true
    restart: unless-stopped
